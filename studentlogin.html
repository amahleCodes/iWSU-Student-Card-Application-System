<!DOCTYPE html>
<html lang="en">
    <head> 
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Student Login Page</title>
        <link rel="stylesheet" href="studentlogin.css">
    </head>
    <body>
        <div class="student-login">
            <a href="homepage.html" class="back-arrow">&larr;</a>
            <h2 class="studentlogin-heading">
                Student Log In
            </h2>
            <p class="studentlogin-instruction">
                Enter student email and password to log in
            </p>
            <form>
                <div class="studentlogin-form">
                    <label class="label">
                        Student Email
                    </label>
                    <input type="email" required placeholder="studentnumber@mywsu.ac.za">
                    <label class="label">
                        Password
                    </label>
                    <input type="password" required>
                </div>
                <button type="submit" class="studentlogin-button">
                    LOG IN
                </button>
            </form>
            <p class="text">Not registered yet?</p>
            <div class="studentlogin-signup">
                <a href="" class="studentlogin-signup-link">Sign Up?</a>
            </div>

        </div>
    </body>
</html>
